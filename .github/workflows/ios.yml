name: Build iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Remove old iOS project
        run: rm -rf ios

      - name: Fix Capacitor permissions
        run: chmod +x node_modules/.bin/cap

      - name: Add iOS platform
        run: ./node_modules/.bin/cap add ios

      - name: Sync Capacitor
        run: ./node_modules/.bin/cap sync ios

      - name: Build iOS
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Create unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r PrivateCatalog.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PrivateCatalog-IPA
          path: PrivateCatalog.ipa
