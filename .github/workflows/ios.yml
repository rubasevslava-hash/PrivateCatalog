name: Build iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build iOS
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Export app
        run: |
          mkdir -p output
          xcodebuild \
            -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath output \
            -exportOptionsPlist ios/ExportOptions.plist || true

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: PrivateCatalog-iOS
          path: |
            build/App.xcarchive
            output/*
