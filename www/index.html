<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrivateCatalog</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0b0f;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    padding: 20px;
    text-align: center;
    font-size: 26px;
    font-weight: bold;
}

.tabs {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 10px 20px 20px;
}

button {
    border: 0;
    border-radius: 12px;
    padding: 12px 18px;
    background: #1b1b23;
    color: white;
    font-size: 15px;
}

button.active {
    background: white;
    color: black;
}

#catalog {
    padding: 10px 15px 40px;
}

.card {
    background: #15151c;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 18px;
}

.card img {
    width: 100%;
    height: 360px;
    object-fit: cover;
}

.info {
    padding: 16px;
}

.name {
    font-size: 22px;
    font-weight: bold;
}

.description {
    color: #aaa;
    margin-top: 8px;
}

.actions {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

.actions button {
    flex: 1;
}

.favorite {
    background: #292933;
}

.empty {
    text-align: center;
    color: #888;
    padding: 50px 20px;
}
</style>
</head>

<body>

<header>PrivateCatalog</header>

<div class="tabs">
    <button id="allBtn" class="active" onclick="showAll()">Анкеты</button>
    <button id="favBtn" onclick="showFavorites()">Избранное</button>
</div>

<div id="catalog"></div>

<script>

const profiles = [
    {
        id: 1,
        name: "Александра",
        description: "Описание анкеты",
        image: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=900"
    },
    {
        id: 2,
        name: "Мария",
        description: "Описание анкеты",
        image: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=900"
    },
    {
        id: 3,
        name: "Елена",
        description: "Описание анкеты",
        image: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=900"
    }
];

let favorites = JSON.parse(localStorage.getItem("favorites") || "[]");

function randomProfiles() {
    return [...profiles].sort(() => Math.random() - 0.5);
}

function render(list) {
    const catalog = document.getElementById("catalog");

    if (!list.length) {
        catalog.innerHTML = '<div class="empty">В избранном пока ничего нет</div>';
        return;
    }

    catalog.innerHTML = list.map(profile => `
        <div class="card">
            <img src="${profile.image}">
            <div class="info">
                <div class="name">${profile.name}</div>
                <div class="description">${profile.description}</div>

                <div class="actions">
                    <button onclick="openProfile(${profile.id})">
                        Открыть
                    </button>

                    <button class="favorite"
                        onclick="toggleFavorite(${profile.id})">
                        ${favorites.includes(profile.id)
                            ? "★ В избранном"
                            : "☆ В избранное"}
                    </button>
                </div>
            </div>
        </div>
    `).join("");
}

function showAll() {
    document.getElementById("allBtn").classList.add("active");
    document.getElementById("favBtn").classList.remove("active");

    render(randomProfiles());
}

function showFavorites() {
    document.getElementById("favBtn").classList.add("active");
    document.getElementById("allBtn").classList.remove("active");

    render(profiles.filter(p => favorites.includes(p.id)));
}

function toggleFavorite(id) {
    if (favorites.includes(id)) {
        favorites = favorites.filter(x => x !== id);
    } else {
        favorites.push(id);
    }

    localStorage.setItem("favorites", JSON.stringify(favorites));

    showAll();
}

function openProfile(id) {
    const profile = profiles.find(p => p.id === id);

    alert(
        profile.name +
        "\n\n" +
        profile.description
    );
}

showAll();

</script>

</body>
</html>
